services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-music}
      POSTGRES_USER: ${POSTGRES_USER:-music}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ${MUSIC_DATA_DIR:-./data}/postgres:/var/lib/postgresql
    expose:
      - "5432"
    networks:
      - radio
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  music-web:
    image: ${RADIO_WEB_IMAGE:-local/music-web:dev}
    build:
      context: ./web
    ports:
      - "127.0.0.1:${MUSIC_WEB_PORT:-8088}:8080"
    expose:
      - "8080"
    networks:
      - edge
    volumes:
      - ${MUSIC_DATA_DIR:-./data}/hls:/public/live:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /bin/busybox
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  icecast-kh:
    image: local/radio-icecast-kh:kh22
    build:
      context: ./radio
      dockerfile: icecast/Dockerfile
      args:
        ICECAST_KH_VERSION: ${ICECAST_KH_VERSION:-icecast-2.4.0-kh22}
    environment:
      TZ: ${RADIO_TIMEZONE:-Etc/UTC}
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME:-localhost}
      ICECAST_STREAM_URL: ${ICECAST_STREAM_URL:-http://localhost:8000/radio.aac}
      ICECAST_ADMIN_EMAIL: ${ICECAST_ADMIN_EMAIL:-admin@localhost}
      ICECAST_MAX_CLIENTS: ${ICECAST_MAX_CLIENTS:-500}
      ICECAST_MAX_SOURCES: ${ICECAST_MAX_SOURCES:-1}
    secrets:
      - icecast_source_password
      - icecast_admin_password
    volumes:
      - ${MUSIC_CONFIG_DIR:-./radio/config}/icecast.xml.template:/etc/icecast/icecast.xml.template:ro
      - ${MUSIC_DATA_DIR:-./data}/logs/icecast:/var/log/icecast:rw
    expose:
      - "8000"
    networks:
      edge:
        aliases:
          - icecast-kh
      radio:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.50
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /proc/1/stat
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  liquidsoap:
    image: local/radio-liquidsoap:2.4.5
    build:
      context: ./radio
      dockerfile: liquidsoap/Dockerfile
      args:
        LIQUIDSOAP_IMAGE: ${LIQUIDSOAP_IMAGE:-ghcr.io/savonet/liquidsoap-alpine:v2.4.5}
    environment:
      TZ: ${RADIO_TIMEZONE:-Etc/UTC}
      HOME: /tmp
    secrets:
      - icecast_source_password
    volumes:
      - ${MUSIC_CONFIG_DIR:-./radio/config}/liquidsoap.liq:/etc/liquidsoap/radio.liq.template:ro
      - ${MUSIC_DATA_DIR:-./data}/music:/music:ro
      - ${MUSIC_DATA_DIR:-./data}/hls:/hls:rw
    depends_on:
      icecast-kh:
        condition: service_healthy
    expose:
      - "1234"
    networks:
      - radio
    group_add:
      - "10000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 0.80
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /proc/1/stat
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  radio-api:
    image: local/radio-api:latest
    build:
      context: ./radio
      dockerfile: api/Dockerfile
    environment:
      TZ: ${RADIO_TIMEZONE:-Etc/UTC}
      RADIO_API_UUID: ${RADIO_API_UUID:?RADIO_API_UUID is required}
      RADIO_QUEUE_DIR: /queue/new
      RADIO_STATE_DIR: /state/jobs
      RADIO_DB_HOST: postgres
      RADIO_DB_PORT: "5432"
      RADIO_DB_NAME: ${POSTGRES_DB:-music}
      RADIO_DB_USER: ${POSTGRES_USER:-music}
      RADIO_DB_PASSWORD_FILE: /run/secrets/postgres_password
      RADIO_ADMIN_PASSWORD_FILE: /run/secrets/music_admin_password
      LIQUIDSOAP_CONTROL_HOST: liquidsoap
      LIQUIDSOAP_CONTROL_PORT: "1234"
      RADIO_MUSIC_DIR: /music
    volumes:
      - ${MUSIC_DATA_DIR:-./data}/queue:/queue:rw
      - ${MUSIC_DATA_DIR:-./data}/state/jobs:/state/jobs:rw
      - ${MUSIC_DATA_DIR:-./data}/music:/music:ro
    secrets:
      - postgres_password
      - music_admin_password
    expose:
      - "8080"
    depends_on:
      icecast-kh:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - edge
      - radio
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  radio-worker:
    image: local/radio-ytdlp:alpine
    build:
      context: ./radio
      dockerfile: ytdlp/Dockerfile
    environment:
      TZ: ${RADIO_TIMEZONE:-Etc/UTC}
      HOME: /tmp
      RADIO_MAX_PLAYLIST_ITEMS: ${RADIO_MAX_PLAYLIST_ITEMS:-100}
      RADIO_MAX_VIDEO_SECONDS: ${RADIO_MAX_VIDEO_SECONDS:-13200}
      RADIO_JOB_TIMEOUT_SECONDS: ${RADIO_JOB_TIMEOUT_SECONDS:-14400}
      RADIO_POLL_SECONDS: ${RADIO_POLL_SECONDS:-2}
      RADIO_QUEUE_NEW: /queue/new
      RADIO_QUEUE_PROCESSING: /queue/processing
      RADIO_QUEUE_FAILED: /queue/failed
      RADIO_INCOMING_DIR: /incoming
      RADIO_MUSIC_DIR: /music
      RADIO_STATE_DIR: /state
    volumes:
      - ${MUSIC_DATA_DIR:-./data}/queue:/queue:rw
      - ${MUSIC_DATA_DIR:-./data}/incoming:/incoming:rw
      - ${MUSIC_DATA_DIR:-./data}/music:/music:rw
      - ${MUSIC_DATA_DIR:-./data}/state:/state:rw
    user: "${MUSIC_WORKER_UID:-10001}:${MUSIC_WORKER_GID:-10000}"
    networks:
      - downloader
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 0.80
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /proc/1/stat
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
    external: true
  radio:
    driver: bridge
    internal: true
  downloader:
    driver: bridge

secrets:
  music_admin_password:
    file: ${MUSIC_SECRETS_DIR:-./secrets}/music_admin_password
  postgres_password:
    file: ${MUSIC_SECRETS_DIR:-./secrets}/postgres_password
  icecast_source_password:
    file: ${MUSIC_SECRETS_DIR:-./secrets}/icecast_source_password
  icecast_admin_password:
    file: ${MUSIC_SECRETS_DIR:-./secrets}/icecast_admin_password
